[project]
name = "account-vault"
version = "0.1.0"
description = "Ultrafast System-One browsing agent with a local-first encrypted account store."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.14"
dependencies = [
    # Decide-step wire client (TypeSafe /v1/systemone shape; see ADR-001).
    "httpx[http2]>=0.28,<1",
    # CDP transport (jev-ultrafast's harness); browser.py drives it directly.
    "browser-harness==0.1.13",
    # Settings (.env loading in settings.py).
    "python-dotenv>=1.0",
]

[project.scripts]
account-vault-demo = "account_vault.demo:main"

[project.optional-dependencies]
# Local decide model: LiquidAI/d1-2B via Transformers (ADR-001 primary).
# Heavy (torch) — optional so the hosted-Jev path installs in seconds.
# torch/transformers are imported lazily in local_decider.py;
# torchvision/pillow are imported by the d1 checkpoint's own
# trust_remote_code image processors, not by this package.
local = [
    "transformers>=5.19",
    "torch>=2.5",
    "torchvision>=0.20",
    "pillow>=11,<13",
    "accelerate>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/account_vault"]

[dependency-groups]
dev = [
    "pytest>=9.2,<10",
    "ruff>=0.14,<1",
    "pytest-cov>=6,<8",
    "mypy>=2.4,<3",
]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = "src/account_vault"
strict = true

# browser-harness ships no py.typed/stubs; it is only touched through
# the lazy _harness() indirection in browser.py.
[[tool.mypy.overrides]]
module = "browser_harness.*"
ignore_missing_imports = true

# torch/transformers are the optional `local` extra (ADR-001): the
# types CI job syncs --dev only, so they are absent there. They are
# touched solely through the lazy loader in local_decider.py, typed
# as Any at that seam.
[[tool.mypy.overrides]]
module = "torch.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "transformers.*"
ignore_missing_imports = true

# Native TOML config (pytest >= 9.0), replacing [tool.pytest.ini_options].
# Strict mode enables strict_config/markers/parametrization_ids/xfail plus
# any strictness options future pytest versions add; upstream recommends
# it only with a pinned/locked pytest, which uv.lock + --locked give us.
# Deprecation warnings are errors so removed-in-next-major API use fails
# here instead of at the next major bump. Blanket warning errors are
# deliberately not enabled: browser-harness's IPC client leaks
# ResourceWarnings (detached daemon process, unclosed unix sockets)
# that are benign in tests and outside our control.
[tool.pytest]
minversion = "9.2"
strict = true
testpaths = ["tests"]
addopts = ["-rs"]
markers = [
    "socket: binds a real loopback listening socket (skips where a sandbox forbids it)",
]
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
]
