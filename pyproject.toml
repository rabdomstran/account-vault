[project]
name = "account-vault"
version = "0.1.0"
description = "Ultrafast System-One browsing agent with a local-first encrypted account store."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.14"
dependencies = [
    # Decide-step wire client (TypeSafe /v1/systemone shape; see ADR-001).
    "httpx[http2]>=0.28,<1",
    # Browser drivers: browser-use (ultrafast mode) + jev-ultrafast's harness.
    "browser-use>=0.8",
    "browser-harness==0.1.13",
    # State / question schemas and settings.
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    # Encrypted vault: AEAD + modern KDF. Vault data lives outside the repo.
    "cryptography>=43",
    "argon2-cffi>=23.1",
]

[project.scripts]
account-vault-demo = "account_vault.demo:main"

[project.optional-dependencies]
# Local decide model: LiquidAI/d1-2B via Transformers (ADR-001 primary).
# Heavy (torch) — optional so the hosted-Jev path installs in seconds.
local = [
    "transformers>=5.19",
    "torch>=2.5",
    "torchvision>=0.20",
    "pillow>=11,<13",
    "accelerate>=1.1",
]
# Screenshot perception fallback: Cactus Mirage (ADR-001). Primary
# perception is the DOM snapshot and needs none of this.
perception = [
    "cactus-compute>=0.1",
    "pillow>=11,<13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/account_vault"]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "ruff>=0.14,<1",
    "pillow>=11,<13",
    "pytest-cov>=6,<8",
    "mypy>=2.4,<3",
]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = "src/account_vault"
strict = true

# browser-harness ships no py.typed/stubs; it is only touched through
# the lazy _harness() indirection in browser.py.
[[tool.mypy.overrides]]
module = "browser_harness.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "socket: binds a real loopback listening socket (skips where a sandbox forbids it)",
]
