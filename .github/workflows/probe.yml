name: probe
on: workflow_dispatch
permissions: { contents: read }
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with: { version: "0.12.1", python-version: "3.13" }
      - run: uv sync --locked --dev
      - run: uv run python scripts/probe_socket.py
      - run: uv run pytest -rs --durations=5 tests/test_demo.py::test_inspector_serves_over_a_real_socket -p no:cacheprovider
      - run: uv run pytest -rs --durations=5 tests/test_demo.py -p no:cacheprovider
