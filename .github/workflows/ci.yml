name: CI

on:
  # push is main-only: with an unrestricted push trigger every PR
  # commit ran the full workflow twice (push + pull_request for the
  # same SHA). PR branches are gated by the pull_request run; main
  # keeps its post-merge run.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly bit-rot check (Mondays 06:17 UTC): catches runner/platform
    # drift even when nothing has been pushed. Dependency updates come
    # from Dependabot (.github/dependabot.yml) as PRs through this gate.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel only superseded PR runs. Pushes to main and the weekly
  # scheduled run always finish: cancelling them would leave the
  # required checks missing (not failed) on the merged commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint (ruff check + format)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # setup-uv persists uv's cache itself: the cache key is computed
      # from hashes of the files matching cache-dependency-glob, so no
      # hand-rolled actions/cache key is needed.
      # See https://docs.astral.sh/uv/guides/integration/github/#caching
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          cache-suffix: lint

      # --locked: fail if uv.lock is out of date with pyproject.toml.
      # No --all-extras: the `local` extra pulls torch, which neither
      # the suite nor ruff needs.
      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

  types:
    name: types (mypy strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          cache-suffix: types

      - name: Install dependencies
        run: uv sync --locked --dev

      # Configuration lives in pyproject.toml [tool.mypy]: strict mode
      # over src/account_vault. Tests are out of scope (they drive the
      # code through Mocks and monkeypatching by design).
      - name: Mypy
        run: uv run mypy

  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Both ends of requires-python = ">=3.12,<3.14" in pyproject.toml,
        # on Linux and macOS (the socket test must pass on both).
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # cache-suffix keeps matrix jobs from racing to save one cache key.
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.1"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          cache-suffix: ${{ matrix.os }}-${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --dev

      # -rs: print skip reasons so it is visible in the log that the
      # only skipped tests are the opt-in live-CDP tests.
      # Coverage floor: suite measures 92% (browser.py 97%, __main__
      # 100%; remaining gaps are mostly demo.py and model.py edge
      # paths). 89 is the regression floor, not an aspiration.
      # --durations: keep the slowest tests visible in every log
      # (a getfqdn stall once hid 35s inside the macOS socket test).
      - name: Test with coverage
        run: >-
          uv run pytest -rs --durations=15
          --cov=account_vault
          --cov-report=term-missing
          --cov-fail-under=89

  build:
    name: build (wheel + sdist assets)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          cache-suffix: build

      - name: Build sdist and wheel
        run: uv build

      # The inspector, static browser, and CDP backend load non-Python
      # files from the package directory at runtime (static/ plus the
      # in-page JS: snapshot.js, act.js, settle.js). Guard the packaging:
      # every non-.py package file must ship in both distributions
      # (scripts/check_dist_assets.py, shared with the release workflow).
      - name: Verify package assets ship in both distributions
        run: uv run --no-project python scripts/check_dist_assets.py

      # And the wheel must actually install with assets on disk where
      # browser.py/demo.py look for them (package-relative paths).
      - name: Verify wheel installs with assets in place
        run: |
          uv pip install --no-deps --target /tmp/wheel-check dist/*.whl
          test -f /tmp/wheel-check/account_vault/snapshot.js
          test -f /tmp/wheel-check/account_vault/act.js
          test -f /tmp/wheel-check/account_vault/settle.js
          test -f /tmp/wheel-check/account_vault/static/index.html
          test -f /tmp/wheel-check/account_vault/static/app.js
          test -f /tmp/wheel-check/account_vault/static/style.css
          test -f /tmp/wheel-check/account_vault/static/fixture.html
          test -f /tmp/wheel-check/account_vault/static/catalog.html

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  e2e:
    name: e2e (offline demo)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          cache-suffix: e2e

      - name: Install dependencies
        run: uv sync --locked --dev

      # Real entry points, no mocks: `python -m account_vault` on the
      # example page plus the inspector server as a subprocess driven
      # over HTTP to done. A loop regression fails here even if the
      # unit suite stays green. See scripts/e2e_offline_demo.py.
      - name: Run offline demo end to end
        run: uv run python scripts/e2e_offline_demo.py

  # Real-browser coverage of the CDP path the offline suite fakes:
  # perception of the JS-rendered fixture, native-input commits,
  # covered-target recovery, multi-viewport scroll, screenshots.
  # The runner image ships Chrome; the fixture launches it headless
  # with a throwaway profile on a loopback debug port and drives
  # only file:/data: pages (no network, no API keys, deciders are
  # the offline doubles). A missing browser fails the fixture, so
  # this gate cannot go green by skipping. Linux-only and one
  # Python on purpose: what is exercised is Chrome/CDP behavior,
  # already matrix-covered for OS/Python by the offline jobs.
  # Run standalone: the harness binds its daemon name at import.
  #
  # Two shards on separate runners (a fixed debug port and daemon
  # name rule out xdist in one job): the busy-load scroll test was
  # ~2/3 of the file's runtime and set the CI critical path.
  # The `live` aggregator below keeps the required context name.
  live-shard:
    name: live shard (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: load
            k: "scroll_commit_lag_under_main_thread_load"
          - shard: rest
            k: "not scroll_commit_lag_under_main_thread_load"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          cache-suffix: live-${{ matrix.shard }}

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Show Chrome version
        run: google-chrome --version || chromium --version || chromium-browser --version

      - name: Run live CDP tests
        env:
          ACCOUNT_VAULT_LIVE: "1"
        run: uv run pytest -rs tests/test_live_cdp.py -k "${{ matrix.k }}"

  live:
    name: live (headless Chrome)
    needs: live-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both shards green
        run: test "${{ needs.live-shard.result }}" = "success"
